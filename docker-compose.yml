# FlowPilot AI: local stack.
#   docker compose up --build -d
# Requires a .env file next to this one (copy .env.example and set the passwords).
#
# Start order: db (healthy) -> migrate (runs Flyway once, exits 0) -> app.
# Phase 5 adds Nginx in front and scales "app" to several replicas.
name: flowpilot

x-backend-image: &backend-image
  build: ./backend
  image: flowpilot-backend:local

x-app-environment: &app-environment
  FLOWPILOT_DB_URL: jdbc:postgresql://db:5432/flowpilot
  FLOWPILOT_DB_APP_PASSWORD: ${FLOWPILOT_DB_APP_PASSWORD:?set FLOWPILOT_DB_APP_PASSWORD in .env}
  FLOWPILOT_JWT_SECRET: ${FLOWPILOT_JWT_SECRET:?set FLOWPILOT_JWT_SECRET in .env}
  FLOWPILOT_ALLOWED_ORIGINS: ${FLOWPILOT_ALLOWED_ORIGINS:-http://localhost:5173}
  FLOWPILOT_DOCUMENTS_PATH: /data/documents   # NEW
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  FLOWPILOT_OLLAMA_URL: ${FLOWPILOT_OLLAMA_URL:-http://host.docker.internal:11434}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: flowpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FLOWPILOT_DB_MIGRATOR_PASSWORD: ${FLOWPILOT_DB_MIGRATOR_PASSWORD:?set FLOWPILOT_DB_MIGRATOR_PASSWORD in .env}
      FLOWPILOT_DB_APP_PASSWORD: ${FLOWPILOT_DB_APP_PASSWORD:?set FLOWPILOT_DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # local-only, for development tools and "mvnw spring-boot:run"
    healthcheck:
      # TCP check: during first-time init the server only listens on a Unix socket,
      # so this stays unhealthy until init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d flowpilot"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  migrate:
    <<: *backend-image
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: migrate
      FLOWPILOT_DB_MIGRATOR_PASSWORD: ${FLOWPILOT_DB_MIGRATOR_PASSWORD:?set FLOWPILOT_DB_MIGRATOR_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  app:
    <<: *backend-image
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Temporary direct access (replaced by Nginx in Phase 5). Host port is configurable
      # because 8080 is often taken by other local projects.
      - "127.0.0.1:${FLOWPILOT_HTTP_PORT:-8090}:8080"
    volumes:                                    # NEW
      - documents:/data/documents               # NEW
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks: [backend]

volumes:
  pgdata:
  documents:                                    # NEW

networks:
  backend:
